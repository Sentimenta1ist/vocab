server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls and health check to the backend service.
    # BACKEND_URL is substituted from the environment variable at container start,
    # e.g. http://vocab-backend:8000  (internal Coolify service name + port)
    location /api/ {
        proxy_pass         ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass ${BACKEND_URL}/health;
    }

    # All other paths → SPA shell (index.html handles routing client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
